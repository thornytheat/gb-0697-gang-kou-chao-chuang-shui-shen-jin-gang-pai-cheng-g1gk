<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link href="/static/theme.css" rel="stylesheet"><link href="/static/layout.css" rel="stylesheet"><link href="/static/components.css" rel="stylesheet"><link href="/static/booking.css" rel="stylesheet"></head><body><div class="app"><aside class="rail"><a href="/booking" class="portmark">TIDE<br><span>引航调度室</span></a><nav><a href="/"><span>01-07</span>潮窗排程台</a><a href="/booking" class="selected"><span>08</span>进港计划占窗</a></nav><div class="signal">UTC / 深水窗<br>同一航段同时刻唯一占位</div></aside><div class="work"><header class="topbar"><span class="channel">NORTH CHANNEL</span><h1>进港计划占窗工作台</h1><button class="btn" id="refresh" type="button">刷新看板</button></header><main class="content booking"><section class="panel receipt" id="receipt-panel" hidden><div class="panel-head"><h2>冲突回执</h2><span id="receipt-code">PLAN_CONFLICT</span></div><div class="receipt-body" id="receipt-body"></div></section><div class="booking-grid"><section class="panel"><div class="panel-head"><h2 id="form-title">提交进港计划</h2><span>同一航段半开区间 [起, 止)</span></div><form id="plan-form" class="plan-form"><label>计划编号<input name="plan_id" required placeholder="PLAN-101"></label><label>船舶编号<input name="vessel_id" required placeholder="MV_ORION"></label><label>航段编号<input name="segment" required placeholder="SEG-N1"></label><label>开始时刻<input name="start" type="datetime-local" step="1" required></label><label>结束时刻<input name="end" type="datetime-local" step="1" required></label><label>幂等键 request_key<input name="request_key" required><small>断网重试保持同键，不会重复占位</small></label><div class="button-row"><button type="button" class="btn" id="new-key">换幂等键</button><button type="submit" class="btn solid" id="submit-btn">提交占窗</button><button type="button" class="btn" id="retry-btn" hidden>原样重试（同键）</button></div><output id="notice" role="status"></output></form></section><section class="panel"><div class="panel-head"><h2>生效占位</h2><span>同航段同时刻仅一份</span></div><div class="scroll"><table class="ledger"><thead><tr><th>计划</th><th>船舶</th><th>航段</th><th>开始UTC</th><th>结束UTC</th><th>版本</th></tr></thead><tbody id="effective-body"><tr><td>暂无生效占位</td></tr></tbody></table></div></section><section class="panel wide"><div class="panel-head"><h2>计划看板（最新版本 / 全量状态）</h2><span>生效 · 待调整 · 已替换 · 已取消</span></div><div class="scroll"><table class="ledger"><thead><tr><th>计划编号</th><th>船舶</th><th>航段</th><th>申请时段 UTC</th><th>版本</th><th>状态</th><th>冲突回执 / 操作</th></tr></thead><tbody id="plans-body"><tr><td>暂无计划</td></tr></tbody></table></div></section></div></main><footer class="statusbar"><span>M8 进港计划占窗 · 事务级互斥</span><span>半开区间 · 结束同刻可接下一航次</span><a href="/docs">接口</a></footer></div></div><script src="/static/booking.js" defer></script></body></html>
